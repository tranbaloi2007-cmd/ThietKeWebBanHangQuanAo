<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FASHION STORE</title>
    <link rel="stylesheet" href="dangnhap.css">
</head>
<body>

    <header class="login-header">
        <a href="index.html" class="logo">FASHION STORE</a>
        <a href="index.html" class="back-home">← Quay về trang chủ</a>
    </header>

    <main class="login-container">
        <section class="login-box">
            <p class="eyebrow">WELCOME TO FASHION STORE</p>
            <h1 id="form-title">ĐĂNG NHẬP</h1>
            <p class="description" id="form-description">
                Chào mừng bạn quay trở lại!
            </p>

            <form id="login-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email"
                       placeholder="Nhập email của bạn" required>

                <label for="login-password">Mật khẩu</label>
                <input type="password" id="login-password"
                       placeholder="Nhập mật khẩu" required>

                <button type="submit" class="submit-btn">ĐĂNG NHẬP</button>
            </form>

            <form id="register-form" class="hidden">
                <label for="register-name">Họ và tên</label>
                <input type="text" id="register-name"
                       placeholder="Nhập họ và tên" required>

                <label for="register-email">Email</label>
                <input type="email" id="register-email"
                       placeholder="Nhập email của bạn" required>

                <label for="register-password">Mật khẩu</label>
                <input type="password" id="register-password"
                       placeholder="Tạo mật khẩu" minlength="6" required>

                <label for="confirm-password">Nhập lại mật khẩu</label>
                <input type="password" id="confirm-password"
                       placeholder="Nhập lại mật khẩu" minlength="6" required>

                <button type="submit" class="submit-btn">TẠO TÀI KHOẢN</button>
            </form>

            <p class="switch-text" id="switch-text">
                Chưa có tài khoản?
                <button type="button" id="show-register">Đăng ký ngay</button>
            </p>

            <p id="message" aria-live="polite"></p>
        </section>
    </main>

    <script src="dangnhap.js"></script>
</body>
</html>
